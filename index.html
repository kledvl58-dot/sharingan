
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naruto Sharingan</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:white;font-family:Arial,sans-serif;overflow:hidden}
.scene{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#480000,#160000 50%,#050505)}
.scene:before{content:"";position:absolute;inset:-30%;background:repeating-radial-gradient(ellipse,transparent 0 75px,#ff10101c 78px 81px,transparent 84px 135px);animation:ambient 24s linear infinite}
.ring{position:absolute;width:min(85vw,600px);aspect-ratio:1;border:2px solid #ff191966;border-radius:50%;box-shadow:0 0 35px #f00a,inset 0 0 35px #f00a;animation:pulse 4s infinite}
.ring:before,.ring:after{content:"";position:absolute;inset:7%;border:2px dashed #ff2525aa;border-radius:50%;animation:spin 18s linear infinite}
.ring:after{inset:16%;border:3px solid #ff252555;animation-direction:reverse;animation-duration:10s}
.eye{width:min(55vw,370px);aspect-ratio:1;z-index:1;filter:drop-shadow(0 0 25px #f00);animation:float 4s ease-in-out infinite}
.eye svg{width:100%;height:100%;animation:spin 18s linear infinite}
.content{position:absolute;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);width:95%;display:flex;align-items:center;flex-direction:column;gap:16px;text-align:center;text-shadow:0 2px 12px #000}
.eyebrow{font-size:12px;letter-spacing:5px}
h1{font-size:clamp(55px,12vw,100px);font-weight:1000;font-style:italic;text-shadow:4px 5px #9b0000,0 0 25px #f007}
h1 span{color:#ff2020}
.subtitle{font-size:12px;letter-spacing:3px}
.play{margin-top:10px;width:min(85%,340px);padding:17px 20px;background:#100000e8;border:2px solid #ff2525;color:white;font-size:15px;font-weight:bold;letter-spacing:2px;cursor:pointer;box-shadow:0 0 22px #f006;transition:.2s}
.play:hover{background:#a00000;transform:scale(1.04)}
.status{color:#ffbaba;font-size:11px;letter-spacing:3px;min-height:14px}
.footer{font-size:10px;letter-spacing:2px}
.footer b{color:#ff2525}
.snow{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.flake{position:absolute;bottom:-20px;left:var(--left);width:var(--size);height:var(--size);background:white;border-radius:50%;opacity:var(--opacity);box-shadow:0 0 8px white;animation:rise var(--duration) linear var(--delay) infinite}
.video-screen{display:none;position:fixed;inset:0;z-index:9999;background:#000f;align-items:center;justify-content:center;padding:20px}
.video-screen.show{display:flex}
.video-screen video{width:100%;max-width:420px;max-height:85vh;border:2px solid #ff2020;box-shadow:0 0 30px #f008;background:#000}
.close{position:absolute;top:18px;right:18px;padding:12px 16px;background:#b00000;color:white;border:0;border-radius:6px;font-size:20px;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.04);opacity:1}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes ambient{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%,85%{opacity:var(--opacity)}100%{transform:translateY(-115vh) translateX(35px);opacity:0}}
@media(max-width:600px){.eye{width:67vw}.ring{width:94vw}.eyebrow{letter-spacing:3px}.footer{letter-spacing:1px}}
</style>
</head>

<body>
<main class="scene">
<div class="ring"></div>

<div class="eye">
<svg viewBox="0 0 300 300">
<circle cx="150" cy="150" r="143" fill="#030303" stroke="#ff1717" stroke-width="3"/>
<g fill="#e50916" stroke="#050505" stroke-width="7">
<path id="blade" d="M150 20 Q200 80 190 115 Q170 140 150 140 Q130 140 110 115 Q100 80 150 20Z"/>
<use href="#blade" transform="rotate(60 150 150)"/>
<use href="#blade" transform="rotate(120 150 150)"/>
<use href="#blade" transform="rotate(180 150 150)"/>
<use href="#blade" transform="rotate(240 150 150)"/>
<use href="#blade" transform="rotate(300 150 150)"/>
</g>
<circle cx="150" cy="150" r="68" fill="none" stroke="#050505" stroke-width="9"/>
<path d="M85 110 Q150 130 215 190 M215 110 Q150 130 85 190 M110 85 Q130 150 190 215 M190 85 Q170 150 110 215" fill="none" stroke="#050505" stroke-width="8"/>
<circle cx="150" cy="150" r="28" fill="#050505" stroke="#ff2020" stroke-width="3"/>
</svg>
</div>

<div class="snow" id="snow"></div>

<section class="content">
<p class="eyebrow">THE LEGENDARY NINJA</p>
<h1>NARU<span>TO</span></h1>
<p class="subtitle">THE POWER OF THE SHARINGAN</p>
<button class="play" id="playBtn">▶ &nbsp; PLAY THE NARUTO</button>
<p class="status" id="status">BELIEVE IT!</p>
<p class="footer">NEVER GIVE UP <b>·</b> NEVER BACK DOWN</p>
</section>
</main>

<div class="video-screen" id="videoScreen">
<button class="close" id="closeVideo">✕</button>
<video id="narutoVideo" controls playsinline>
<source src="1793715806593.mp4" type="video/mp4">
Hindi mahanap ang video file.
</video>
</div>

<script>
const snow=document.getElementById("snow");

for(let i=0;i<80;i++){
 const f=document.createElement("span");
 f.className="flake";
 f.style.setProperty("--left",Math.random()*100+"%");
 f.style.setProperty("--size",2+Math.random()*4+"px");
 f.style.setProperty("--opacity",.3+Math.random()*.7);
 f.style.setProperty("--duration",5+Math.random()*10+"s");
 f.style.setProperty("--delay",-Math.random()*15+"s");
 snow.appendChild(f);
}

const videoScreen=document.getElementById("videoScreen");
const video=document.getElementById("narutoVideo");
const status=document.getElementById("status");

document.getElementById("playBtn").addEventListener("click",async()=>{
 videoScreen.classList.add("show");
 video.currentTime=0;
 try{await video.play();}
 catch(e){status.textContent="VIDEO READY — PRESS PLAY";}
});

function closeVideo(){
 video.pause();
 video.currentTime=0;
 videoScreen.classList.remove("show");
}
document.getElementById("closeVideo").addEventListener("click",closeVideo);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeVideo();});
</script>
</body>
</html>
